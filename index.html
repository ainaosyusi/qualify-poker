<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>役判定練習</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>役判定練習</h1>
    <div id="mode-selection">
        <button id="mode-normal-button">通常の役判定</button>
        <button id="mode-mix-button">ミックスゲーム役判定</button>
        <button id="mode-practice-button">実践モード</button>
        <button id="color-assist-button" class="small-button">色アシスト</button>
    </div>
    <div id="game-selection">
        <!-- 通常モードの選択肢 -->
        <div id="normal-mode-options">
            <div id="sub-mode-selection">
                <button id="mode-hand-button">役を当てる</button>
                <button id="mode-winner-button">勝者を当てる</button>
                <button id="time-attack-button" class="small-button">タイムアタックモード</button>
            </div>
            <div id="player-selection">
                <label for="num-players">プレイヤーの人数を選択：</label>
                <select id="num-players">
                    <option value="2">2人</option>
                    <option value="3">3人</option>
                    <option value="4">4人</option>
                    <option value="5">5人</option>
                    <option value="6">6人</option>
                    <option value="7">7人</option>
                    <option value="8">8人</option>
                    <option value="9">9人</option>
                </select>
                <button id="start-button">開始</button>
            </div>
        </div>
        <!-- ミックスゲームの選択肢 -->
        <div id="mix-mode-options" style="display: none;">
            <div id="mix-game-selection">
                <button id="super-holdem-button">スーパーホールデム</button>
                <button id="ocean-button">オーシャン</button>
            </div>
            <div id="mix-sub-mode-selection">
                <button id="mix-mode-hand-button">役を当てる</button>
                <button id="mix-mode-winner-button">勝者を当てる</button>
                <button id="mix-time-attack-button" class="small-button">タイムアタックモード</button>
            </div>
            <div id="mix-player-selection">
                <label for="mix-num-players">プレイヤーの人数を選択：</label>
                <select id="mix-num-players">
                    <option value="2">2人</option>
                    <option value="3">3人</option>
                    <option value="4">4人</option>
                </select>
                <button id="mix-start-button">開始</button>
            </div>
        </div>
        <!-- 実践モードのオプション -->
        <div id="practice-mode-options" style="display: none;">
            <h2>実践モードの設定</h2>
            <label for="practice-num-players">プレイヤー数:</label>
            <input type="number" id="practice-num-players" value="2" min="2" max="9">
            <div class="mode-buttons">
                <button id="practice-mode-hand-button" class="mode-button active-mode">役を当てる</button>
                <button id="practice-mode-winner-button" class="mode-button">勝者を当てる</button>
            </div>
            <button id="practice-time-attack-button">タイムアタックモード</button>
            <button id="practice-start-button">ゲーム開始</button>
        </div>

    </div>

    <div id="game-area" style="display: none;">
        <div id="timer" style="font-size: 24px; margin: 20px;"></div>
        <div id="counter" style="font-size: 24px; margin: 20px;"></div>
        <div id="board-cards">
            <h2>ボード</h2>
            <div id="board"></div>
        </div>

        <div id="players-hands">
            <h2>プレイヤーのハンド</h2>
            <div id="hands"></div>
        </div>

        <button id="chop-button">チョップ</button>
        <button id="next-button" style="display: none;">次の問題に進む</button>
        <button id="main-menu-button">メインメニューに戻る</button>
    </div>

    <div id="result-area" style="display: none;">
        <h2>結果</h2>
        <p id="result-message"></p>
        <button id="review-button" style="display: none;">振り返り</button>
        <button id="result-restart-button">スタートに戻る</button>
    </div>

    <div id="review-area" style="display: none;">
        <h2>間違えた問題の振り返り</h2>
        <div id="review-content"></div>
        <button id="review-restart-button">スタートに戻る</button>
    </div>

    <p id="footer">created by kyoten</p>

    <script src="script.js"></script>
</body>
</html>
